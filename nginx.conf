# Serves the host-prefixed spool subtree: /mirror/<upstream-host>/<repo-path>.
# Client source line: deb http://<mirror-host>/us.archive.ubuntu.com/ubuntu noble main
# (the URL path already carries the upstream-host segment; do not use $host here).
server {
    listen *:80;
    server_name _;

    location / {
      root /mirror;
      autoindex on;
    }
}
